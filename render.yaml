services:
  # ----------------------------------------------------
  # 1. ThreadFlow Backend API (Node.js Web Service)
  # ----------------------------------------------------
  - type: web
    name: threadflow-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx prisma migrate deploy && npm run seed:calibrated && npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SIMULATED_TODAY_DATE
        value: ""
      - key: DATABASE_URL
        fromDatabase:
          name: threadflow-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENCRYPTION_MASTER_KEY
        generateValue: true
      - key: APP_ORIGIN
        value: https://threadflow-frontend.onrender.com
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-1.5-flash
      - key: AI_API_KEY
        sync: false

  # ----------------------------------------------------
  # 2. ThreadFlow Frontend UI (Fast Global Static Site)
  # ----------------------------------------------------
  - type: static
    name: threadflow-frontend
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://threadflow-backend.onrender.com

# ----------------------------------------------------
# 3. ThreadFlow PostgreSQL Database (Render Managed)
# ----------------------------------------------------
databases:
  - name: threadflow-db
    plan: free
    databaseName: threadflow
    user: threadflow_user
